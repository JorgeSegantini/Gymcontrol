name: gym_control
description: "Aplicativo offline para registro de atividades físicas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  archive: ^4.0.9
  cross_file: ^0.3.5+4
  share_plus: ^12.0.2
  file_selector: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/biblioteca/
